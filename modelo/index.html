<!DOCTYPE html>
<html lang="pt_BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo</title>
    <link rel="stylesheet" href="/modelo/assets/css/style.css">
</head>

<body>

    <section class="container">
        <h1>Tabela IMC</h1>

        <p>
            Menos do que 18,5 > Abaixo do peso <br>
            Entre 18,5 e 24,9 > Peso normal <br>
            Entre 25 e 29,9 >   Sobrepeso <br>
            Entre 30 e 34,9 > Obesidade grau 1 <br>
            Entre 35 e 39,9 > Obesidade grau 2 <br>
            Mais do que 40 > Obesidade grau 13
        </p>

        <h1>Calcule o seu IMC:</h1>
        <form action="/" id="formulario" method="POST">
            <label for="input-teste-1">Peso:</label>
            <input type="text" id="peso" name="peso">

            <label for="input-teste-2">Altura:</label>
            <input type="text" id="altura" name="peso">

            <button type="submit">Envio</button>
        </form>

        <div id="resultado"></div>
    </section>

    <script src="/modelo/assets/js/main.js"></script>
</body>

</html>
